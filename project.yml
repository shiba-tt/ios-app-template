name: "StarterApp"
options:
  minimumXcodeGenVersion: "2.48.0"
  # Keep in sync with .xcode-version so Xcode does not ask to upgrade the generated project.
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    # Recommended by Xcode 27.2's "Update to recommended settings".
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
settingGroups:
  iOSDeviceFamily:
    TARGETED_DEVICE_FAMILY: "1"
targets:
  "StarterApp":
    type: application
    platform: iOS
    sources:
      - App
    settings:
      groups: [iOSDeviceFamily]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.starterapp"
        INFOPLIST_KEY_CFBundleDisplayName: "StarterApp"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - "StarterAppTests"
        - "StarterAppUITests"
  "StarterAppTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
    settings:
      groups: [iOSDeviceFamily]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.starterapp.tests"
    dependencies:
      - target: "StarterApp"
  "StarterAppUITests":
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    settings:
      groups: [iOSDeviceFamily]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.starterapp.uitests"
    dependencies:
      - target: "StarterApp"
